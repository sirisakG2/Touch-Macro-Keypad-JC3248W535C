; Touch Macro Keypad for Guition JC3248W535C (ESP32-S3, AXS15231B 320x480 QSPI, touch 0x3B)
; Base settings from the esp32-s3-jc3248w535c skill (templates/platformio-base.ini).
; Deviation: ARDUINO_USB_MODE=0 (TinyUSB OTG) so the board can be a USB HID keyboard + CDC serial.
[platformio]
default_envs = keypad

[env:keypad]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    ; LDF does not pass FS to LittleFS/USB in this core; add its headers explicitly
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"1.1.0\"
lib_deps =
    ; pinned git tags (works without the PlatformIO registry)
    https://github.com/moononournation/Arduino_GFX.git#v1.6.9
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.1
